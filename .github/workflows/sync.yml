name: Sync with upstream
on:
  push:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: main
    - name: Fetch upstream
      run: git remote add upstream https://github.com/hjdhnx/dr_py.git
    - name: Sync with upstream
      env:
        GITHUB_TOKEN: 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
      run: |
        git fetch upstream
        git checkout main
        git merge upstream/main
        git push
