name: Sync with upstream
on:
  push:
    branches:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Sync with Upstream
      run: |
        git remote add upstream https://github.com/hjdhnx/dr_py.git
        git fetch upstream
        git checkout master
        git merge upstream/master
        git push origin master
