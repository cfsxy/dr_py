name: Sync with upstream

on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@v2
      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git merge upstream/master
          git push origin master
        
