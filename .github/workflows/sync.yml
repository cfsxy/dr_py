name: Merge upstream branches
on:
  push:
    branches: [main, master]
  schedule:
    - cron: 0 */12 * * *   # 每隔12小时

jobs:
merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Merge upstream
      run: |
          git config --global user.name "cfsxy"
          git config --global user.email "514624507@qq.com"
          git pull --unshallow
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git checkout master
          git merge --no-edit upstream/master
          git push origin master
          git fetch upstream --tags
          git push --tags
