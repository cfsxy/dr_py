name: Merge upstream branches
on:
  push:
  schedule:
    - cron: '0 */12 * * *'   # 每隔12小时

jobs:
    sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Sync with upstream
      run: |
          git config --global user.name "cfsxy"
          git config --global user.email "514624507@qq.com"
          git pull --unshallow
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git checkout master
          git merge --no-edit upstream/master
          git push origin master
          git fetch upstream --tags
          git push --tags
