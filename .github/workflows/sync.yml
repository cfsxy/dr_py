name: Sync with upstream
on:
  push:
  schedule:
    - cron: '0 */12 * * *'
jobs:
   sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v2
        with:
          repository: hjdhnx/dr_py
          ref: dr_py
          path: upstream
      - name: Checkout fork
        uses: actions/checkout@v2
      - name: Sync
        run: |
          git config user.name "cfsxy"
          git config user.email "514624507@qq.com"
          git fetch upstream dr_py
          git merge upstream/dr_py --no-edit
          git push
