name: Merge upstream

on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Merge upstream
        run: |
          # 自行替换要同步的上游仓库地址
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git rebase upstream/main
          git push origin master
          git push
          
          
