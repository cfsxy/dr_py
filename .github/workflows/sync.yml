name: Sync with upstream
on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: TG908/fork-sync@v1.6.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: hjdhnx # fork 的上游仓库 user
          head: hjdhnx/dr_py # fork 的上游仓库 branch
          base: cfsxy/dr_py # 本地仓库 branch
