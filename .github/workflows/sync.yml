name: Merge upstream branches
on:
  push:
  schedule:
    - cron: 0 */12 * * *
    # 每隔12小时

jobs:
repo-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - name: repo-sync
      uses: repo-sync/github-sync@v2
      with:
        source_repo: "https://github.com/hjdhnx/dr_py.git"
        source_branch: "hjdhnx/dr_py"
        destination_branch: "cfsxy/dr_py"
        github_token: ${{ secrets.PAT }}
