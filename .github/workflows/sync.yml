name: Merge upstream

on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Merge upstream
        run: |
          git config user.name "cfsxy"
          git config user.email "514624507@qq.com"
          git pull
          # 自行替换要同步的上游仓库地址
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git checkout -b master hjdhnx/dr_py
          git merge  cfsxy/dr_py
          git push origin master
          
          
