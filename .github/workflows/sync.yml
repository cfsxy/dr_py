name: Merge upstream

on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Merge upstream
        run: |

          # 自行替换要同步的上游仓库地址
          git remote add upstream https://github.com/hjdhnx/dr_py.git
          git fetch upstream
          git checkout  dr_py
          git merge  dr_py
          git push origin dr_py
          
          
