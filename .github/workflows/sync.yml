name: Sync with upstream
on:
  push:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v2
        with:
          repository: https://github.com/hjdhnx/dr_py.git
          ref: https://github.com/hjdhnx/dr_py
          path: upstream
      - name: Checkout fork
        uses: actions/checkout@v2
      - name: Sync
        run: |
          git config user.name 'cfsxy'
          git config user.email '514624507@qq.com'
          git fetch upstream https://github.com/hjdhnx/dr_py
          git merge upstream/https://github.com/hjdhnx/dr_py --no-edit
          git push
